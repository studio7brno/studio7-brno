    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #dcaeb6;
      --gold-dk: #a06b72;
      --t1: #1a1917;
      --t3: #575452;
      --bg: #dedad4;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Montserrat', sans-serif;
    }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--t1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 16px;
    }
    .logo { width: 84px; margin-bottom: 36px; }
    .num {
      font-family: var(--serif);
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 300;
      color: var(--gold-dk);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .divider {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 18px auto 0;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 300;
      margin: 20px 0 18px;
    }
    p {
      font-size: 0.95rem;
      color: var(--t3);
      line-height: 1.7;
      max-width: 400px;
      margin: 0 auto 34px;
    }
    a.btn {
      display: inline-block;
      background: var(--gold);
      color: #131210;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 15px 32px;
      transition: background 0.3s;
    }
    a.btn:hover { background: #d29ea8; }
    nav.links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 26px;
      margin-top: 36px;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    nav.links a { color: var(--gold-dk); text-decoration: none; border-bottom: 1px solid transparent; }
    nav.links a:hover { border-bottom-color: var(--gold); }
  </style>
