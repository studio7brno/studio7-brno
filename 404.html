<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stránka nenalezena | Studio 7 Brno</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #dcaeb6;
      --gold-dk: #a06b72;
      --t1: #1a1917;
      --t3: #575452;
      --bg: #dedad4;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Montserrat', sans-serif;
    }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--t1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 16px;
    }
    .logo { width: 84px; margin-bottom: 36px; }
    .num {
      font-family: var(--serif);
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 300;
      color: var(--gold-dk);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .divider {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 18px auto 0;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 300;
      margin: 20px 0 18px;
    }
    p {
      font-size: 0.95rem;
      color: var(--t3);
      line-height: 1.7;
      max-width: 400px;
      margin: 0 auto 34px;
    }
    a.btn {
      display: inline-block;
      background: var(--gold);
      color: #131210;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 15px 32px;
      transition: background 0.3s;
    }
    a.btn:hover { background: #d29ea8; }
    nav.links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 26px;
      margin-top: 36px;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    nav.links a { color: var(--gold-dk); text-decoration: none; border-bottom: 1px solid transparent; }
    nav.links a:hover { border-bottom-color: var(--gold); }
  </style>
</head>
<body>
  <a href="/"><img src="/logo/logo_studio7.svg" alt="Studio 7 Brno" class="logo" /></a>
  <div class="num">404</div>
  <div class="divider"></div>
  <h1>Stránka nenalezena</h1>
  <p>Tato stránka neexistuje nebo byla přesunuta. Vraťte se na úvod a najdete vše potřebné.</p>
  <a href="/" class="btn">Zpět na úvod</a>
  <nav class="links" aria-label="Služby">
    <a href="/nehty-brno.html">Nehty</a>
    <a href="/rasy-brno.html">Řasy</a>
    <a href="/maderoterapie-brno.html">Maderoterapie</a>
    <a href="/#pricing">Ceník</a>
    <a href="tel:+420604665740">604 665 740</a>
  </nav>
</body>
</html>
