<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stránka nenalezena | Studio 7 Brno</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c9a96e;
      --gold-dk: #a07840;
      --cream: #f0ede9;
      --ink: #1a1917;
      --serif: 'Cormorant Garamond', serif;
      --sans: 'Montserrat', sans-serif;
    }
    body {
      font-family: var(--sans);
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .logo { width: 80px; margin-bottom: 40px; opacity: 0.7; }
    .num {
      font-family: var(--serif);
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 300;
      color: var(--gold);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 300;
      margin: 16px 0 24px;
    }
    p {
      font-size: 0.95rem;
      color: #6b6560;
      line-height: 1.7;
      max-width: 380px;
      margin-bottom: 40px;
    }
    a.btn {
      display: inline-block;
      background: var(--gold);
      color: #fff;
      font-family: var(--sans);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 16px 40px;
      transition: background 0.3s;
    }
    a.btn:hover { background: var(--gold-dk); }
    .divider {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 32px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <img src="logo/logo_studio7.svg" alt="Studio 7 Brno" class="logo" />
  <div class="num">404</div>
  <div class="divider"></div>
  <h1>Stránka nenalezena</h1>
  <p>Tato stránka neexistuje nebo byla přesunuta. Vraťte se na úvod a najdete vše potřebné.</p>
  <a href="/" class="btn">Zpět na úvod</a>
</body>
</html>
